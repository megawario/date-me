<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Review the available Date-a-Mario profiles.">
    <title>Profiles | Date-a-Mario</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js" defer></script>
  </head>
  <body class="profiles-page">
    <a class="skip-link" href="#main-content">Skip to profiles</a>

    <header class="profiles-header">
      <div class="container profiles-header__inner">
        <p class="site-brand">Date-a-Mario</p>
      </div>
    </header>

    <main id="main-content" class="profiles-main">
      <h1 class="visually-hidden">Date-a-Mario profiles</h1>
      <div class="profile-experience">
        <div class="profile-deck" data-profile-deck tabindex="0" aria-label="Mario profiles. Scroll down for more cards, or swipe left or right to choose.">
          <div class="swipe-decision-layer" data-swipe-decision aria-hidden="true">
            <span data-swipe-decision-label></span>
          </div>
          <p class="profile-deck__status" data-profile-status>Loading profiles…</p>
        </div>

        <noscript>
          <p class="profile-deck__status">JavaScript is required to load the profile configuration.</p>
        </noscript>

        <div class="swipe-feedback" data-swipe-feedback aria-live="polite" aria-atomic="true">
          <span class="swipe-feedback__message">Swipe left or right when you are ready.</span>
        </div>

        <section class="profile-complete" data-profile-complete hidden tabindex="-1" aria-labelledby="complete-title">
          <p class="eyebrow">You survived every Mario</p>
          <h2 id="complete-title">There is only one profile left.</h2>
          <p>Continue this extremely rigorous selection process on Instagram.</p>
          <a class="button profile-complete__link" href="https://www.instagram.com/radioactive_space_hamster?igsh=MW5tOThuNzhhMnUzaA==">Open Instagram</a>
          <p class="profile-complete__note">@radioactive_space_hamster</p>
          <button class="button button--reset" type="button" data-reset-deck>Review again</button>
        </section>
      </div>
    </main>
  </body>
</html>
